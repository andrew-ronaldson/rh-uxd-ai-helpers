name: Update Fullsend review harness

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

concurrency:
  group: update-fullsend-review
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'rh-uxd/ai-helpers'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      UPDATE_BRANCH: automation/update-fullsend-review
    steps:
      - name: Check out the default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Fullsend CLI
        uses: fullsend-ai/fullsend@d5f36921ac754705619f38c637ef692873809fbc # v0.43.0
        with:
          agent: __install_only__
          version: v0.43.0

      - name: Update the upstream review pin
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-fullsend-review-pin.py
          if git diff --quiet -- .fullsend/harness/review.yaml; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Regenerate the Fullsend lockfile
        if: steps.update.outputs.changed == 'true'
        run: fullsend lock --all --update --fullsend-dir .fullsend

      - name: Validate the generated update
        if: steps.update.outputs.changed == 'true'
        run: |
          make validate
          git diff --check

      - name: Create or refresh the maintenance pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "The Fullsend review harness is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${UPDATE_BRANCH}"
          git add .fullsend/harness/review.yaml .fullsend/lock.yaml
          git commit -m "chore: update Fullsend review harness"
          gh auth setup-git
          git push --force-with-lease origin "HEAD:${UPDATE_BRANCH}"

          open_pr=$(gh pr list \
            --repo "${REPOSITORY}" \
            --state open \
            --head "${UPDATE_BRANCH}" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "${open_pr}" ]]; then
            gh pr edit "${open_pr}" \
              --repo "${REPOSITORY}" \
              --title "chore: update Fullsend review harness" \
              --body "Updates the pinned upstream Fullsend review harness and regenerates the lockfile. The change remains subject to normal maintainer review before merge."
          else
            gh pr create \
              --repo "${REPOSITORY}" \
              --base main \
              --head "${UPDATE_BRANCH}" \
              --title "chore: update Fullsend review harness" \
              --body "Updates the pinned upstream Fullsend review harness and regenerates the lockfile. The change remains subject to normal maintainer review before merge."
          fi
